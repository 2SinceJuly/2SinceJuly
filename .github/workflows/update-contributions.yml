name: Update Contributions

on:
  schedule:
    - cron: "40 19 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh contribution table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql --paginate --slurp -F login="$GITHUB_REPOSITORY_OWNER" -f query='
            query($login: String!, $endCursor: String) {
              user(login: $login) {
                pullRequests(first: 100, after: $endCursor, states: MERGED) {
                  pageInfo { hasNextPage endCursor }
                  nodes { number title repository { nameWithOwner isPrivate stargazerCount } }
                }
              }
            }' > "$RUNNER_TEMP/merged.json"
          python3 tools/contributions.py "$GITHUB_REPOSITORY_OWNER" < "$RUNNER_TEMP/merged.json"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stars/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): refresh contribution list"
            git push
          fi
